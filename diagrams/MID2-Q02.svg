<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="100%" height="auto" style="max-width: 720px; display: block; margin: 0 auto; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="gradCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gradCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="gradEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="gradAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="gradRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
  </defs>
  <rect width="720" height="260" rx="12" fill="#090d16" stroke="#1e293b" stroke-width="2"/>

  <text x="360" y="28" font-size="15" font-weight="bold" fill="#38bdf8" text-anchor="middle">THE TRANSFORMATION PROCESS BLOCK DIAGRAM</text>
    <g filter="url(#shadow)">
    <rect x="20" y="60" width="115" height="65" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="77.5" y="88.5" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">1. 8x8 Partition</text>
    <text x="77.5" y="105.5" font-size="11" fill="#94a3b8" text-anchor="middle">Localized stats</text>
    
  </g>
    <line x1="135" y1="92" x2="160" y2="92" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrAmber)"/>
  
    <g filter="url(#shadow)">
    <rect x="160" y="60" width="115" height="65" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="217.5" y="88.5" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">2. 2D-DCT</text>
    <text x="217.5" y="105.5" font-size="11" fill="#94a3b8" text-anchor="middle">Decorrelation</text>
    <rect x="200" y="51" width="70" height="18" rx="9" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/><text x="235" y="64" font-size="9" font-weight="bold" fill="#38bdf8" text-anchor="middle">Energy</text>
  </g>
    <line x1="275" y1="92" x2="300" y2="92" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrCyan)"/>
  
    <g filter="url(#shadow)">
    <rect x="300" y="60" width="115" height="65" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="357.5" y="88.5" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">3. Quantize</text>
    <text x="357.5" y="105.5" font-size="11" fill="#94a3b8" text-anchor="middle">HVS Matrix</text>
    <rect x="340" y="51" width="70" height="18" rx="9" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/><text x="375" y="64" font-size="9" font-weight="bold" fill="#38bdf8" text-anchor="middle">Lossy</text>
  </g>
    <line x1="415" y1="92" x2="440" y2="92" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrAmber)"/>
  
    <g filter="url(#shadow)">
    <rect x="440" y="60" width="115" height="65" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
    <text x="497.5" y="88.5" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">4. Zig-Zag</text>
    <text x="497.5" y="105.5" font-size="11" fill="#94a3b8" text-anchor="middle">Zero-run order</text>
    
  </g>
    <line x1="555" y1="92" x2="580" y2="92" stroke="#c084fc" stroke-width="2" marker-end="url(#arrAmber)"/>
  
    <g filter="url(#shadow)">
    <rect x="580" y="60" width="120" height="65" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <text x="640.0" y="88.5" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">5. Huffman</text>
    <text x="640.0" y="105.5" font-size="11" fill="#94a3b8" text-anchor="middle">Entropy Coding</text>
    <rect x="625" y="51" width="70" height="18" rx="9" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/><text x="660" y="64" font-size="9" font-weight="bold" fill="#38bdf8" text-anchor="middle">Output</text>
  </g>

  <rect x="20" y="145" width="680" height="95" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="35" y="170" font-size="11" font-weight="bold" fill="#38bdf8">Justification of Transformation Steps:</text>
  <text x="35" y="190" font-size="10" fill="#cbd5e1">1. Partition: Limits computation and adapts to non-stationary image regions.</text>
  <text x="35" y="208" font-size="10" fill="#cbd5e1">2. 2D-DCT: Packs 90% energy into top-left coefficients; completely decorrelates pixels.</text>
  <text x="35" y="226" font-size="10" fill="#cbd5e1">3. Quantize: Exploits HVS blindness to high spatial frequencies, zeroing out insignificant terms.</text>

</svg>