<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 320" width="100%" height="auto" style="max-width: 740px; display: block; margin: 0 auto; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="gradCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gradCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="gradEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="gradAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="gradRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
  </defs>
  <rect width="740" height="320" rx="12" fill="#090d16" stroke="#1e293b" stroke-width="2"/>

  <text x="370" y="32" font-size="16" font-weight="bold" fill="#38bdf8" text-anchor="middle">SPEECH PRODUCTION: SOURCE-FILTER MECHANISM (FAN\'S MODEL)</text>
  <rect x="20" y="55" width="220" height="235" rx="10" fill="#1e293b" fill-opacity="0.4" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="130" y="78" font-size="12" font-weight="bold" fill="#fbbf24" text-anchor="middle">EXCITATION SOURCE E(z)</text>
    <g filter="url(#shadow)">
    <rect x="40" y="95" width="180" height="50" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="130.0" y="116.0" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">1. Lungs & Trachea</text>
    <text x="130.0" y="133.0" font-size="11" fill="#94a3b8" text-anchor="middle">Subglottal Air Pressure</text>
    
  </g>
    <line x1="130" y1="145" x2="130" y2="185" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrAmber)"/>
  <text x="130.0" y="159.0" font-size="10" fill="#fbbf24" font-weight="600" text-anchor="middle">Airflow</text>
    <g filter="url(#shadow)">
    <rect x="40" y="185" width="180" height="85" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="130.0" y="223.5" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">2. Glottis / Vocal Cords</text>
    <text x="130.0" y="240.5" font-size="11" fill="#94a3b8" text-anchor="middle">Voiced: Pulses (Pitch F0)\nUnvoiced: Turbulent Noise</text>
    <rect x="145" y="176" width="70" height="18" rx="9" fill="#fbbf24" fill-opacity="0.2" stroke="#fbbf24" stroke-width="1"/><text x="180" y="189" font-size="9" font-weight="bold" fill="#fbbf24" text-anchor="middle">Source</text>
  </g>

    <line x1="220" y1="225" x2="275" y2="225" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrCyan)"/>
  <text x="247.5" y="219.0" font-size="10" fill="#38bdf8" font-weight="600" text-anchor="middle">Raw Acoustic e(t)</text>

  <rect x="275" y="55" width="260" height="235" rx="10" fill="#1e293b" fill-opacity="0.4" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="405" y="78" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">VOCAL TRACT FILTER H(z)</text>
    <g filter="url(#shadow)">
    <rect x="295" y="95" width="220" height="50" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="405.0" y="116.0" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">Pharynx (Throat Cavity)</text>
    <text x="405.0" y="133.0" font-size="11" fill="#94a3b8" text-anchor="middle">Cross-section ~17.5 cm</text>
    
  </g>
    <g filter="url(#shadow)">
    <rect x="295" y="155" width="220" height="55" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="405.0" y="178.5" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">Oral & Nasal Cavities</text>
    <text x="405.0" y="195.5" font-size="11" fill="#94a3b8" text-anchor="middle">Resonances = Formants (F1, F2, F3)</text>
    <rect x="440" y="146" width="70" height="18" rx="9" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/><text x="475" y="159" font-size="9" font-weight="bold" fill="#38bdf8" text-anchor="middle">Filter</text>
  </g>
    <g filter="url(#shadow)">
    <rect x="295" y="220" width="220" height="50" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="405.0" y="241.0" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">Articulators (Tongue/Lips)</text>
    <text x="405.0" y="258.0" font-size="11" fill="#94a3b8" text-anchor="middle">Shaping Vowels & Consonants</text>
    
  </g>

    <line x1="515" y1="225" x2="570" y2="225" stroke="#34d399" stroke-width="2" marker-end="url(#arrEmerald)"/>
  <text x="542.5" y="219.0" font-size="10" fill="#34d399" font-weight="600" text-anchor="middle">Acoustic Wave</text>

  <rect x="570" y="55" width="150" height="235" rx="10" fill="#1e293b" fill-opacity="0.4" stroke="#34d399" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="645" y="78" font-size="12" font-weight="bold" fill="#34d399" text-anchor="middle">OUTPUT s(t)</text>
    <g filter="url(#shadow)">
    <rect x="580" y="115" width="130" height="60" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
    <text x="645.0" y="141.0" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">Lip Radiation</text>
    <text x="645.0" y="158.0" font-size="11" fill="#94a3b8" text-anchor="middle">R(z) ≈ 1 - z^-1</text>
    
  </g>
    <g filter="url(#shadow)">
    <rect x="580" y="195" width="130" height="75" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
    <text x="645.0" y="228.5" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">Radiated Speech</text>
    <text x="645.0" y="245.5" font-size="11" fill="#94a3b8" text-anchor="middle">S(z) = E·H·R\nAudio Waveform</text>
    <rect x="635" y="186" width="70" height="18" rx="9" fill="#34d399" fill-opacity="0.2" stroke="#34d399" stroke-width="1"/><text x="670" y="199" font-size="9" font-weight="bold" fill="#34d399" text-anchor="middle">Speech</text>
  </g>

</svg>