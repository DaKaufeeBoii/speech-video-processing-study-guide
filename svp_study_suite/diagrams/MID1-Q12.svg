<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="100%" height="270" style="max-width: 720px; height: auto; display: block; margin: 0 auto; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="gradCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gradCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="gradEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="gradAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="gradRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
  </defs>
  <rect width="720" height="270" rx="12" fill="#090d16" stroke="#1e293b" stroke-width="2"/>

  <text x="360" y="28" font-size="15" font-weight="bold" fill="#38bdf8" text-anchor="middle">LPCC VS. MFCC ARCHITECTURAL COMPARISON</text>
  
  <!-- LPCC Path -->
  <g transform="translate(30, 50)">
    <rect width="660" height="90" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="330" y="20" font-size="12" font-weight="bold" fill="#fbbf24" text-anchor="middle">LPCC: Acoustic All-Pole Tube Model (Noise-Sensitive, No Zeros)</text>
      <g filter="url(#shadow)">
    <rect x="30" y="32" width="100" height="45" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="80.0" y="50.5" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">Raw Speech</text>
    <text x="80.0" y="67.5" font-size="11" fill="#94a3b8" text-anchor="middle">Linear scale</text>
    
  </g>
      <line x1="130" y1="54" x2="170" y2="54" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrAmber)"/>
  
      <g filter="url(#shadow)">
    <rect x="170" y="32" width="130" height="45" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="235.0" y="50.5" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">LPC Analysis</text>
    <text x="235.0" y="67.5" font-size="11" fill="#94a3b8" text-anchor="middle">Yule-Walker / Levinson</text>
    
  </g>
      <line x1="300" y1="54" x2="340" y2="54" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrAmber)"/>
  
      <g filter="url(#shadow)">
    <rect x="340" y="32" width="120" height="45" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="400.0" y="50.5" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">Predictor ak</text>
    <text x="400.0" y="67.5" font-size="11" fill="#94a3b8" text-anchor="middle">All-pole filter</text>
    
  </g>
      <line x1="460" y1="54" x2="500" y2="54" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrAmber)"/>
  
      <g filter="url(#shadow)">
    <rect x="500" y="32" width="130" height="45" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="565.0" y="50.5" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">LPCCs</text>
    <text x="565.0" y="67.5" font-size="11" fill="#94a3b8" text-anchor="middle">Recursive Cepstrum</text>
    <rect x="555" y="23" width="70" height="18" rx="9" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/><text x="590" y="36" font-size="9" font-weight="bold" fill="#38bdf8" text-anchor="middle">Low Bitrate</text>
  </g>
  </g>

  <!-- MFCC Path -->
  <g transform="translate(30, 155)">
    <rect width="660" height="95" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <text x="330" y="20" font-size="12" font-weight="bold" fill="#34d399" text-anchor="middle">MFCC: Human Auditory Cochlea Model (Highly Robust to Noise, ASR Standard)</text>
      <g filter="url(#shadow)">
    <rect x="30" y="32" width="85" height="45" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <text x="72.5" y="50.5" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">Raw Speech</text>
    <text x="72.5" y="67.5" font-size="11" fill="#94a3b8" text-anchor="middle">Pre-emphasized</text>
    
  </g>
      <line x1="115" y1="54" x2="140" y2="54" stroke="#34d399" stroke-width="2" marker-end="url(#arrEmerald)"/>
  
      <g filter="url(#shadow)">
    <rect x="140" y="32" width="80" height="45" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <text x="180.0" y="50.5" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">FFT</text>
    <text x="180.0" y="67.5" font-size="11" fill="#94a3b8" text-anchor="middle">|X[k]| Mag</text>
    
  </g>
      <line x1="220" y1="54" x2="245" y2="54" stroke="#34d399" stroke-width="2" marker-end="url(#arrEmerald)"/>
  
      <g filter="url(#shadow)">
    <rect x="245" y="32" width="120" height="45" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <text x="305.0" y="50.5" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">Mel Filterbank</text>
    <text x="305.0" y="67.5" font-size="11" fill="#94a3b8" text-anchor="middle">Critical bands</text>
    
  </g>
      <line x1="365" y1="54" x2="390" y2="54" stroke="#34d399" stroke-width="2" marker-end="url(#arrEmerald)"/>
  
      <g filter="url(#shadow)">
    <rect x="390" y="32" width="80" height="45" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <text x="430.0" y="50.5" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">Log E</text>
    <text x="430.0" y="67.5" font-size="11" fill="#94a3b8" text-anchor="middle">Loudness</text>
    
  </g>
      <line x1="470" y1="54" x2="495" y2="54" stroke="#34d399" stroke-width="2" marker-end="url(#arrEmerald)"/>
  
      <g filter="url(#shadow)">
    <rect x="495" y="32" width="135" height="45" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <text x="562.5" y="50.5" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">13 MFCCs</text>
    <text x="562.5" y="67.5" font-size="11" fill="#94a3b8" text-anchor="middle">DCT-II Decorrelation</text>
    <rect x="555" y="23" width="70" height="18" rx="9" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/><text x="590" y="36" font-size="9" font-weight="bold" fill="#38bdf8" text-anchor="middle">ASR Standard</text>
  </g>
  </g>

</svg>